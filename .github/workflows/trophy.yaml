name: Update Trophy SVG

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  trophy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to commit the generated SVG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate trophy SVG
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          curl -fsSL \
            "https://github-profile-trophy.vercel.app/?username=${REPO_OWNER}&no-frame=true&margin-w=10" \
            -o profile/trophy.svg

      - name: Commit trophy SVG
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: update trophy SVG"
          file_pattern: profile/trophy.svg
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
